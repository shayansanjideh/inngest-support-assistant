<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Brain</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#4f46e5; --ok:#15803d; --warn:#b45309; --warnbg:#fef3c7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(300px, 1fr) 2fr; gap:20px; padding:20px 24px; max-width:1300px; margin:0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  textarea { width:100%; min-height:140px; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.approve { background:var(--ok); color:#fff; border-color:var(--ok); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .msg { background:#f5f5f4; border-radius:8px; padding:8px 10px; margin-bottom:8px; white-space:pre-wrap; font-size:14px; }
  ol.steps { list-style:none; padding:0; margin:0; }
  ol.steps li { padding:4px 0; font-size:14px; display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); }
  ol.steps li span { color:var(--muted); font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .hi { background:#dcfce7; color:var(--ok); } .lo { background:var(--warnbg); color:var(--warn); }
  .gap { background:var(--warnbg); color:#78350f; border-radius:8px; padding:8px 10px; margin:10px 0; font-size:14px; }
  .answer { border-top:1px solid var(--line); margin-top:10px; padding-top:6px; }
  .answer pre { background:#f5f5f4; padding:10px; border-radius:6px; overflow:auto; font-size:13px; }
  .sources a.fix { color:var(--ok); }
  .sources a { display:block; font-size:13px; color:var(--accent); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .status { font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .sent { border:2px solid var(--ok); }
</style>
</head>
<body>
<header><h1>Support Brain</h1><span>Inngest-powered draft answers. A human approves every reply.</span></header>
<main>
  <section class="panel">
    <h2>Customer question</h2>
    <div id="source" class="muted"></div>
    <div id="messages"></div>
    <textarea id="q" placeholder="Paste a GitHub issue link or a support question. A follow-up sent within 5 s is merged into the same run."></textarea>
    <div class="row">
      <button class="primary" id="send">Send</button>
      <button id="new">New thread</button>
    </div>
    <h2 style="margin-top:18px">Pipeline</h2>
    <ol class="steps" id="steps"><li class="muted">Nothing yet.</li></ol>
    <p class="muted" id="run"></p>
  </section>
  <section class="panel" id="draftPanel">
    <h2>Draft for review <span id="status" class="status"></span></h2>
    <div id="draft" class="muted">The draft appears here once the function reaches the approval step.</div>
  </section>
</main>
<script>
let threadId = location.hash.slice(1) || null, timer = null, editing = false, sourceUrl = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("send").onclick = async () => {
  const text = $("q").value.trim(); if (!text) return;
  const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, threadId, sourceUrl }) });
  const j = await r.json(); if (j.error) { alert(j.error); return; }
  threadId = j.threadId; location.hash = threadId; $("q").value = ""; editing = false;
  if (!timer) timer = setInterval(poll, 1000); poll();
};
$("new").onclick = () => { threadId = null; sourceUrl = null; location.hash = ""; editing = false; $("source").innerHTML = ""; render(null); };
if (threadId) { timer = setInterval(poll, 1000); poll(); }

async function poll() { if (threadId) render(await (await fetch(`/api/threads/${threadId}`)).json()); }

function render(t) {
  if (!t) { $("messages").innerHTML = ""; $("steps").innerHTML = '<li class="muted">Nothing yet.</li>'; $("draft").innerHTML = '<span class="muted">The draft appears here once the function reaches the approval step.</span>'; $("status").textContent = ""; $("run").textContent = ""; return; }
  $("messages").innerHTML = t.messages.map((m) => `<div class="msg">${esc(m.length > 260 ? m.slice(0, 260) + "…" : m)}</div>`).join("");
  if (t.sourceUrl) $("source").innerHTML = `GitHub issue <a href="${esc(t.sourceUrl)}" target="_blank">${esc(t.sourceUrl.replace("https://github.com/", ""))}</a>`;
  const t0 = t.steps[0]?.at ?? 0;
  $("steps").innerHTML = t.steps.map((s) => `<li>${esc(s.name)}<span>+${((s.at - t0) / 1000).toFixed(1)} s</span></li>`).join("");
  $("status").textContent = "· " + t.status;
  $("run").innerHTML = t.runId ? `Inngest run <a id="runLink" href="http://127.0.0.1:8288/run?runID=${esc(t.runId)}"><code>${esc(t.runId)}</code></a>` : "";
  $("draftPanel").classList.toggle("sent", t.status === "sent");
  if (editing) return;
  const d = t.draft;
  if (!d) { $("draft").innerHTML = t.status === "working" || t.status === "queued" ? '<span class="muted">Working…</span>' : ""; return; }
  const conf = `<span class="badge ${d.lowConfidence ? "lo" : "hi"}">confidence ${(d.confidence * 100).toFixed(0)}%</span>`;
  const gap = d.lowConfidence ? `<div class="gap"><b>Why unsure:</b> ${esc(d.whyUnsure ?? "Low confidence")}${d.docsGap ? `<br><b>Docs gap:</b> ${esc(d.docsGap)}` : ""}</div>` : "";
  const body = t.status === "sent" ? t.final : d.text;
  $("draft").innerHTML = `${conf}${gap}<div class="answer">${marked.parse(body)}</div>
    <h2 style="margin-top:12px">Cited sources</h2><div class="sources">${mergeCites(d.citations).map((c) => `<a href="${esc(c.url)}" target="_blank">[${c.ns.join(",")}] ${esc(c.title)} · ${esc(c.url.replace(/^https:\/\/(www\.)?/, ""))}</a>` + (c.fixes ?? []).map((f) => `<a class="fix" href="${esc(f.url)}" target="_blank">&nbsp;&nbsp;↳ fixed by ${esc(f.title)}</a>`).join("")).join("") || '<span class="muted">none</span>'}</div>
    ${t.status === "awaiting-review" ? `<div class="row"><button class="approve" id="approve">Approve &amp; send</button><button id="edit">Edit</button></div>` : ""}
    ${t.status === "sent" ? `<p class="muted">Sent. The run resumed from <code>step.waitForEvent</code> and finished.</p>` : ""}`;
  if (t.status === "awaiting-review") {
    $("approve").onclick = () => review("approve");
    $("edit").onclick = () => {
      editing = true;
      $("draft").innerHTML = `<textarea id="editText" style="min-height:320px">${esc(d.text)}</textarea><div class="row"><button class="approve" id="sendEdit">Send edited answer</button><button id="cancel">Cancel</button></div>`;
      $("sendEdit").onclick = () => review("edit", $("editText").value);
      $("cancel").onclick = () => { editing = false; poll(); };
    };
  }
}
// Several chunks of one page can be cited; list each page once with all its numbers.
function mergeCites(cs) {
  const m = new Map();
  for (const c of cs) { const e = m.get(c.url); if (e) e.ns.push(c.n); else m.set(c.url, { ...c, ns: [c.n] }); }
  return [...m.values()];
}
async function review(action, text) {
  editing = false;
  await fetch(`/api/threads/${threadId}/review`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, text }) });
  poll();
}
</script>
</body>
</html>
